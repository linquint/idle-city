name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# The Pages deployment needs to mint an OIDC token to prove the artifact came
# from this workflow; everything else stays read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, but let an in-flight one finish so a partial
# upload is not published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # A repository whose Pages source is still "Deploy from a branch" keeps
      # running GitHub's legacy builder on every push to master, and that
      # builder publishes the repository root — the unbuilt index.html, whose
      # /src/main.ts script tag 404s. It races this workflow and, finishing a
      # few seconds later, wins. Point Pages at Actions so this workflow is the
      # only publisher. Already-correct repositories are unaffected.
      - name: Publish from Actions rather than from the branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow; then
            echo "::warning::Could not set the Pages source. Set Settings -> Pages -> Source to 'GitHub Actions' by hand, then re-run this workflow."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
